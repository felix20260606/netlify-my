var curCat='全部';
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function buildCats(){
  var nrec=DATA.filter(function(r){return r[6];}).length;
  var h='<button data-c="全部" class="on">全部 '+DATA.length+'</button>';
  h+='<button data-c="__rec__" class="rec">&#11088; 推荐 '+nrec+'</button>';
  CATS.forEach(function(c){var k=DATA.filter(function(r){return r[0]===c;}).length;h+='<button data-c="'+c+'">'+c+' '+k+'</button>';});
  document.getElementById('cats').innerHTML=h;
  document.querySelectorAll('#cats button').forEach(function(b){b.onclick=function(){curCat=b.dataset.c;document.querySelectorAll('#cats button').forEach(function(x){x.classList.toggle('on',x===b);});render();};});
}
function render(){
  var rate=parseFloat(document.getElementById('rate').value)||1.6;
  document.getElementById('rateShow').textContent=rate;
  var q=document.getElementById('q').value.trim().toLowerCase();

  var rows=DATA.filter(function(r){
    if(isRec){if(!r[6])return false;}

    return true;
  });

      var sub=esc(r[2]||'');if(r[4])sub+=' · '+esc(r[4]);if(r[5])sub+=' <b class="pm">'+esc(r[5])+'</b>';
      var nu=(r[7]&&r[7].length)?'<div class="nutr"><span class="np">蛋白 <b>'+r[7][0]+'</b></span><span class="nc">碳水 <b>'+r[7][1]+'</b></span><span class="nf">脂肪 <b>'+r[7][2]+'</b></span><small>g/100g</small></div>':'';
      html+='<div class="item'+(r[6]?' isrec':'')+'"><div class="il"><div class="icn">'+star+esc(r[1]||'-')+'</div><div class="ien">'+sub+'</div>'+nu+'</div><div class="ir"><div class="rm">RM '+rm.toFixed(2)+'</div><div class="rmb">&#165;'+rmb.toFixed(1)+'</div>'+(r[8]?'<button class="pbtn" type="button" data-p="'+r[8]+'">&#128247; P'+r[8]+'</button>':'')+'</div></div>';
    });
    html+='</div>';
  });
  document.getElementById('list').innerHTML=html||'<div class="empty">没有匹配的商品</div>';
}
document.getElementById('list').addEventListener('click',function(e){
  var b=e.target.closest('.pbtn');
  if(b&&window.lbShow)window.lbShow(parseInt(b.getAttribute('data-p'),10));
});
buildCats();
document.getElementById('rate').addEventListener('input',render);
document.getElementById('q').addEventListener('input',render);
render();
</script><div id="lb"><img id="lbImg" alt="货架实拍大图"><div class="lbbar"><button id="lbPrev" type="button">&#8592; 上一张</button><b id="lbNum">P1</b><button id="lbNext" type="button">下一张 &#8594;</button><button id="lbClose" type="button">&#10005; 关闭</button></div></div>
<script>
(function(){
  var N=81, built=false, cur=1;
  var grid=document.getElementById('galGrid'), btn=document.getElementById('galBtn');
  var lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg'), lbNum=document.getElementById('lbNum');
  function build(){
    if(built)return; built=true;
    var h='';
    for(var i=1;i<=N;i++){
      var n=(i<10?'0':'')+i;
      h+='<div class="gth" data-i="'+i+'"><img loading="lazy" src="shop-photos/p'+n+'.jpg" alt="货架实拍 P'+i+'"><span>P'+i+'</span></div>';
    }
    grid.innerHTML=h;
    grid.addEventListener('click',function(e){
      var t=e.target.closest('.gth');
      if(t)show(parseInt(t.getAttribute('data-i'),10));
    });
  }
  btn.onclick=function(){
    build();
    grid.classList.toggle('open');
    btn.innerHTML=grid.classList.contains('open')?'&#128247; 收起图库 <small>81 张</small>':'&#128247; 货架实拍图库 <small>81 张 &middot; 点开对照着买</small>';
  };
  function show(i){
    cur=((i-1)%N+N)%N+1;
    var n=(cur<10?'0':'')+cur;
    lbImg.src='shop-photos/p'+n+'.jpg';
    lbNum.textContent='P'+cur+' / '+N;
    lb.classList.add('on');
  }
  window.lbShow=show;
  document.getElementById('lbPrev').onclick=function(e){e.stopPropagation();show(cur-1);};
  document.getElementById('lbNext').onclick=function(e){e.stopPropagation();show(cur+1);};
  document.getElementById('lbClose').onclick=function(){lb.classList.remove('on');};
  lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('on');});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('on'))return;
    if(e.key==='ArrowLeft')show(cur-1);
    else if(e.key==='ArrowRight')show(cur+1);
    else if(e.key==='Escape')lb.classList.remove('on');
  });
})();
</script>
</body></html>
