<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>复习 · 双语字幕</title>
<link rel="icon" href="icons/32.png">
<style>
/* 布局、交互对齐 Language Reactor 的 PhrasePump（2026-11-18 在 LR 网站上逐项对照）；名称、图标、代码是自己的 */
:root{color-scheme:dark;--bg:#1d1e21;--bar:#1a1b1e;--card:#26282c;--card2:#2d2f34;--ink:#E6E8EB;--mut:#8e959e;--pur:#9C3FD0;--pur2:#B985E6;--pur3:#5b2a7c;--grn:#8EE5A1;--line:#34373d;--org:#FFB86B}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}
.vi{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.vi .f{fill:currentColor;stroke:none}.vi .s{fill:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#2c2f35;color:#fff;font:500 12.5px/1 system-ui,"PingFang SC",sans-serif;padding:7px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:30;pointer-events:none}
/* 顶部工具（首页和练习页都有） */
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.tb{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:#cfd3d8}.tb:hover{background:#2e3136}.tb.on{background:#3b2a4a;color:#fff}
.tb.spd{border:1.5px solid #555a62;font:700 12.5px/1 system-ui,sans-serif;width:30px}.tb.spd.slow{background:#8a6d2a;border-color:#8a6d2a;color:#fff}
.hbar{display:flex;align-items:center;height:44px;padding:0 14px;background:var(--bar)}
/* 首页 */
#home{min-height:100%}
#homeIn{max-width:1010px;margin:0 auto;padding:28px 24px 60px;display:flex;gap:56px;flex-wrap:wrap}
.hc{background:var(--card);border-radius:24px;padding:30px 30px 32px;width:448px;max-width:100%;align-self:flex-start}
.hc h1{margin:0 0 22px;font-size:24px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:12px}.hc h1 b{color:var(--grn)}
.lang{font-size:12.5px;font-weight:500;background:#3a3d44;border-radius:6px;padding:1px 8px;color:#dfe2e6}
.today{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin-bottom:10px}.today .emo{font-size:18px}.today b{color:var(--ink);font-weight:500}
.bar{height:5px;border-radius:3px;background:#3a3e45;overflow:hidden}.bar i{display:block;height:100%;background:#4f9e63;width:0;transition:width .3s}
.stats{display:flex;margin:22px 0 18px;padding-bottom:20px;border-bottom:1px solid var(--line)}.stats div{flex:1;cursor:default}
.stats small{display:block;color:var(--mut);font-size:12px}.stats b{font-size:24px;font-weight:500}.stats em{display:block;font-style:normal;color:#c9ced4;font-size:12px}
.go{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:24px}
.go button{background:var(--pur);color:#fff;font-weight:700;font-size:16px;border-radius:8px;padding:10px 20px}.go button:hover{background:#ab52d4}.go button:disabled{opacity:.4;cursor:default}
.go span{color:#c9ced4;font-size:12.5px}
.next{margin-top:22px;font-size:13px;color:#c9ced4}.next b{color:var(--ink);font-weight:700}
.qchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.qchips span{font-size:13.5px;color:var(--org);border:1px solid #6b5333;border-radius:3px;padding:0 4px;line-height:1.5}.qchips span.sg{color:#C9A0E8;border-color:#5d4473}
.empty{color:var(--mut);font-size:14px;margin-top:18px;line-height:1.7}
.opt{flex:1;min-width:320px;padding-top:18px}.opt h3{margin:0 0 12px;font-size:11.5px;font-weight:500;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;min-height:30px;padding:0 6px;font-size:14px}.row>span:first-child{display:flex;align-items:center;gap:12px}.row small{color:var(--mut);font-size:12px}
.row.sub{padding-left:32px}
input[type=checkbox]{appearance:none;width:26px;height:10px;border-radius:999px;background:#3a4048;position:relative;cursor:pointer;margin:0}
input[type=checkbox]::after{content:"";position:absolute;left:-2px;top:-4px;width:18px;height:18px;border-radius:50%;background:#b4bbc3;transition:left .15s,background .15s}
input[type=checkbox]:checked{background:var(--pur3)}input[type=checkbox]:checked::after{left:10px;background:var(--pur2)}
.seg{display:inline-flex;background:#2b2e34;border-radius:7px;padding:2px}.seg b{font-weight:400;font-size:12.5px;color:#aab2ba;padding:3px 9px;border-radius:5px;cursor:pointer}.seg b.on{background:#474c54;color:#fff}
.tgs{display:inline-flex;gap:6px}.tgs b{font-weight:400;font-size:12.5px;border:1.5px solid #4a4f57;color:#EDEFF2;border-radius:999px;padding:0 9px 0 20px;cursor:pointer;position:relative}.tgs b::before{content:"";position:absolute;left:7px;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:50%;background:var(--tc)}.tgs b.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 20%,transparent)}
.t-g{--tc:#8EE05A}.t-y{--tc:#F1E46B}.t-r{--tc:#FF6B5E}.t-b{--tc:#6FD3FF}
/* 练习页 */
#play{display:none;height:100%;flex-direction:column}
#play .hbar .bk{font-size:20px;color:var(--pur2);display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:50%}#play .hbar .bk:hover{background:#2e3136}
.prog{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;font-size:12.5px;color:#cfd3d8}.prog .bar{width:300px;max-width:30vw;height:4px;background:#3a3e45}.prog .bar i{background:#4f9e63}
.hint{text-align:center;color:#c9ced4;font-size:13px;padding:16px 12px 0}.hint small{color:var(--mut);font-size:10.5px;margin-right:6px}
.mid{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0}
.card{position:relative;background:var(--card);width:800px;max-width:100%;min-height:280px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 46px 48px;text-align:center}
.card .pl{position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--pur);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}.card .pl:hover{background:#ab52d4}
.card .cr{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:2px}
.card .ic{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;color:#8b95a1;cursor:pointer;border-radius:5px}.card .ic:hover{color:#fff}.card .ic.on{color:#FFD23F}.card .ic.on .s{fill:currentColor}
.card .en{font-size:19px;font-weight:700;line-height:1.6;max-width:640px}
.card .en .vs-w{cursor:pointer;border-radius:3px}.card .en .vs-w:hover{background:#3a3d44}
.card .en .vs-k{color:#7CE3B8}.card .en .vs-u1,.card .en .vs-ln{color:var(--org)}.card .en .vs-u2{color:#CDA8F7}.card .en .vs-sp{color:#7CE3B8}.card .en .vs-lo{color:var(--org)}
.card .en .tw{box-shadow:inset 0 0 0 1px #8a6a45;border-radius:2px;padding:0 2px;color:var(--org)}
.card .zh{font-size:15px;color:#d5d8dc;margin-top:18px;max-width:640px}
.card .hid{filter:blur(7px);cursor:pointer;user-select:none;transition:filter .15s}
.card .br{position:absolute;right:12px;bottom:10px;display:flex;align-items:center;gap:6px}
.card .tchip{font-size:12.5px;color:#9a8466;border:1px solid #5a4a36;border-radius:2px;padding:0 4px;line-height:1.5}
.card .inf{width:15px;height:15px;border-radius:50%;background:#5b3a78;color:#e9d7f7;font:700 10px/15px system-ui,sans-serif;text-align:center;cursor:pointer;position:relative}
.card .inf .tt{display:none;position:absolute;top:calc(100% + 6px);right:-8px;white-space:nowrap;background:#6a2a8f;color:#fff;font:500 12px/1 system-ui,"PingFang SC",sans-serif;padding:6px 9px;border-radius:5px;z-index:20}.card .inf:hover .tt,.card .inf.on .tt{display:block}.card .inf .tt a{color:#fff}
.card .shot{max-width:100%;max-height:190px;border-radius:6px;margin:-14px 0 20px;display:block}
.card .sg{position:absolute;left:46px;top:14px;font-size:12px;color:#FFBD80;border:1px solid #7a5a36;border-radius:999px;padding:0 9px;cursor:pointer}.card .sg:hover{background:rgba(255,189,128,.12)}.card .sg.on{color:#8EE5A1;border-color:#3f7a52;cursor:default}
.card .pn{margin-top:10px;font-size:13.5px;color:#FFBD80}
.card input{font:700 19px "Noto Sans",system-ui,sans-serif;background:#1b1d21;color:#fff;border:0;border-bottom:2px solid var(--pur2);border-radius:4px 4px 0 0;text-align:center;padding:1px 6px;outline:none}
.card input.ok{border-color:var(--grn);color:var(--grn)}.card input.no{border-color:#ff7a7a;color:#ff7a7a}
.card .ans{margin-top:12px;font-size:14px;color:var(--grn);min-height:20px}.card .ans.no{color:#ff9d9d}
.ctl{display:flex;justify-content:center;gap:14px;padding:10px 0 22px}
.ctl div{display:flex;flex-direction:column;align-items:center;gap:8px}
.ctl button{width:52px;height:52px;border-radius:50%;background:#3a3c42;font-size:24px;display:flex;align-items:center;justify-content:center}
.ctl button:hover{background:#474a51}.ctl button.pri{background:var(--pur)}.ctl button.pri:hover{background:#ab52d4}.ctl button:disabled{opacity:.35;cursor:default}
.ctl kbd{font:11px ui-monospace,monospace;color:var(--mut);border:1px solid #4a4f57;border-radius:3px;padding:0 5px}
.done h2{font-size:22px;margin:0 0 10px}.done p{color:#c9ced4;margin:4px 0}.done button{margin-top:20px;background:var(--pur);color:#fff;font-weight:700;border-radius:8px;padding:9px 20px}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid #4a4f57;border-top-color:#fff;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* 弹层：快捷键、快速设置、单词词典 */
.pop{display:none;position:fixed;z-index:40;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.45)}.pop.on{display:block}
#keysPop{top:46px;right:150px;background:#6a1f8f;color:#fff;padding:12px 14px 10px;font-size:13px}
#keysPop h4{margin:0 0 8px;text-align:center;font-size:13px}#keysPop table{border-collapse:collapse}#keysPop td{padding:4px 5px}#keysPop td:first-child{text-align:right;white-space:nowrap}
#keysPop kbd{display:inline-block;min-width:24px;text-align:center;background:#8d4bb3;border-radius:3px;padding:2px 6px;font:12px system-ui,sans-serif;box-shadow:0 2px 0 #4f1670}#keysPop .or{font-size:10.5px;opacity:.8;margin:0 3px}
#qset{top:46px;right:12px;width:250px;background:#2a2c31;padding:16px 16px 14px;font-size:13px}
#qset h4{margin:0 0 16px;font-size:14px;font-weight:500;color:#d9dce0}#qset label{display:block;font-size:12px;color:#c9ced4;margin-bottom:6px}
#qset select{width:100%;background:#1d1f23;color:#fff;border:1px solid #3e4148;border-radius:5px;padding:7px 8px;font:inherit}
#qset .bt{display:flex;align-items:center;gap:14px;margin-top:18px}#qset .bt button:first-child{background:var(--pur);color:#fff;border-radius:5px;padding:4px 12px}#qset .bt button:last-child{color:#d9dce0}
.wpop{position:fixed;z-index:45;background:#2a2c31;border-radius:6px;padding:8px 10px 6px;min-width:120px;max-width:260px;text-align:left;font-size:14px;box-shadow:0 6px 22px rgba(0,0,0,.5)}
.wpop .hw{display:inline-block;font-size:12px;color:#cfd3d8;background:#3a3d44;border-radius:4px;padding:0 6px;margin-bottom:4px}
.wpop ul{margin:0 0 6px;padding:0 0 0 14px}.wpop li{margin:2px 0}.wpop li::marker{color:#6b7078}
.wpop .wb{display:flex;gap:6px;justify-content:center;border-top:1px solid #3a3d44;padding-top:6px}.wpop .wb button{width:28px;height:22px;border-radius:4px;background:#3a3d44;font-size:13px}.wpop .wb button:hover{background:#4a4e56}.wpop .wb button.on{background:#3f7a52}
/* 右侧词典面板 */
#dict{display:none;position:fixed;top:44px;right:0;bottom:0;width:360px;max-width:92vw;background:#1f2024;border-left:1px solid #2e3136;z-index:35;flex-direction:column}#dict.on{display:flex}
#dict .dh{display:flex;border-bottom:1px solid #2e3136}#dict .dh b{flex:1;text-align:center;padding:9px 0;font-size:13px;font-weight:500;border-bottom:2px solid #fff}
#dict input{margin:8px;background:#26282c;border:1px solid #3a3d44;border-radius:6px;color:#fff;padding:7px 10px;font:inherit;font-size:13.5px;outline:none}
#dict .dr{flex:1;overflow:auto;padding:6px 16px 20px;font-size:14px}#dict .dr .tip{color:var(--mut);font-size:12.5px;text-align:center;margin-top:30px}
#dict .dr .w{font-weight:700;font-size:16px;margin:6px 0}#dict .dr ul{padding-left:16px;margin:4px 0}
body.dict-on .mid,body.dict-on .ctl,body.dict-on .hint{margin-right:360px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#33363c;color:#fff;font-size:13px;padding:7px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}.toast.on{opacity:1}
@media(max-width:700px){#homeIn{padding:20px 14px}.opt{min-width:0}.prog .bar{width:120px}#keysPop{right:8px}}
</style>
<div id="home">
  <div class="hbar"><div class="tools"><button class="tb spd" data-a="spd" data-tip="播放速度">1x</button><button class="tb" data-a="dict" data-tip="词典"></button><button class="tb" data-a="fs" data-tip="全屏"></button></div></div>
  <div id="homeIn">

    <div class="row sub"><span>筛选</span><span class="tgs" id="oTags"><b data-v="g" class="t-g" title="只练带这个颜色标签的已保存项目。">绿色</b><b data-v="y" class="t-y" title="只练带这个颜色标签的已保存项目。">黄色</b><b data-v="r" class="t-r" title="只练带这个颜色标签的已保存项目。">红色</b><b data-v="b" class="t-b" title="只练带这个颜色标签的已保存项目。">蓝色</b></span></div>
  </div>
  </div>
</div>
