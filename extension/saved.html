<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已保存项目 · 双语字幕</title>
<link rel="icon" href="icons/32.png">
<style>
:root{color-scheme:dark;--bg:#1b1d21;--bar:#22242a;--card:#25272c;--ink:#EDEFF2;--mut:#8b95a1;--pur:#9A3FC4;--pur2:#B77CE0;--line:#33373d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}a{color:var(--pur2)}
.vi{width:1em;height:1em;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.vi .f{fill:currentColor;stroke:none}
.tabs{display:flex;align-items:center;gap:4px;background:var(--bar);padding:4px 12px;position:sticky;top:0;z-index:5}
.tabs b{display:flex;align-items:center;gap:8px;font-weight:400;font-size:15px;color:#aab2ba;padding:6px 14px;border-radius:999px;cursor:pointer}.tabs b .vi{font-size:17px}
.tabs b.on{background:#383b42;color:#fff}.tabs b.on .vi{color:#FFD23F}.tabs b[data-t=sents].on .vi{color:var(--pur2)}.tabs b[data-t=all].on .vi{color:#6fb7ff}
.tabs .sp{flex:1}.tabs .rv{background:var(--pur);color:#fff;font-weight:600;border-radius:8px;padding:6px 14px;font-size:14px}
.wrap{padding:14px 44px 60px 20px}
.hd{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}.hd h1{font-size:15px;font-weight:500;margin:0}.hd span{color:var(--mut);font-size:13px}.hd em{margin-left:auto;font-style:normal;color:var(--mut);font-size:12.5px}
.tools{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.q{flex:1;min-width:220px;display:flex;align-items:center;background:var(--bg);border:1px solid #3d4148;border-radius:4px;padding:0 12px}.q input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px;padding:9px 0}.q .vi{font-size:20px;color:#fff}
select{appearance:none;background:var(--bg);color:#c9ced4;border:1px solid #3d4148;border-radius:4px;padding:10px 34px 10px 12px;font:inherit;font-size:15px;min-width:230px;max-width:300px}
.seg{display:inline-flex;background:#2b2e34;border-radius:8px;padding:2px}.seg b{font-weight:400;font-size:13px;color:#aab2ba;padding:5px 12px;border-radius:6px;cursor:pointer}.seg b.on{background:#474c54;color:#fff}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:3px 13px;font-size:13px;border:1.5px solid;cursor:pointer;opacity:.55}.chip.on{opacity:1}.chip b{font-weight:700}.chip .vi{font-size:15px}
.chip.k{border-color:#9CFFCD;color:#9CFFCD}.chip.l{border-color:#FFBD80;color:#FFBD80}.chip.l.on{background:#FFBD80;color:#1b1d21}.chip.g{border-color:#B894C5;color:#B894C5}
.chip.k.on{background:rgba(156,255,205,.14)}.chip.g.on{background:rgba(184,148,197,.16)}.chip i{font-style:italic;font-weight:400;opacity:.8;border-left:1px dotted currentColor;padding-left:8px;margin-left:2px}
.pg{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--mut)}.pg button{font-size:18px;display:inline-flex}.pg button:disabled{opacity:.3;cursor:default}.pg b{color:#fff;border-bottom:1px solid #fff;padding:0 12px;font-weight:400}
.sel{display:none;gap:10px;align-items:center;background:#2b2e34;border-radius:8px;padding:6px 12px;margin-bottom:10px}.sel.on{display:flex}.sel button{background:#3a3d43;border-radius:6px;padding:4px 12px}.sel button:hover{background:#474b52}.sel .del{color:#ff9d9d}
.day{background:#22242a;padding:6px 8px;font-size:12.5px;font-weight:700;letter-spacing:.5px;border-bottom:1px solid var(--line);margin-top:14px}.day span{color:var(--mut);font-weight:400;margin-left:8px}
table{width:100%;border-collapse:collapse;table-layout:fixed}td{overflow:hidden}th{font-weight:400;font-size:12px;color:var(--mut);text-align:left;padding:8px 8px 6px}
td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}tr:hover td{background:#202227}
td.c{text-align:center}td.w{font-size:15px}td.t{color:#d5d9de}td.r{color:#B894C5;text-align:right;padding-right:22px}td.x{font-size:14.5px}td.st{color:var(--mut);font-size:12.5px;white-space:nowrap}
td.p{font-size:15px}
input[type=checkbox]{appearance:none;width:17px;height:17px;border:1.5px solid #9aa4ae;border-radius:3px;margin:0;vertical-align:middle;cursor:pointer}input[type=checkbox]:checked{background:var(--pur2);border-color:var(--pur2);box-shadow:inset 0 0 0 2.5px #1b1d21}
.pl{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--pur);color:#fff;font-size:10px;align-items:center;justify-content:center;vertical-align:middle;margin-right:8px;cursor:pointer}
.vs-w{border-radius:4px}.vs-w.vs-u1{color:#FFB86B}.vs-w.vs-u2{color:#CDA8F7}.vs-w.vs-sp,.vs-w.vs-k{color:#7CE3B8}
.vs-w.vs-lo,.wb{box-shadow:inset 0 0 0 1.5px #E9CF8A;background:rgba(255,226,140,.14);border-radius:5px;padding:0 3px;color:#FFB86B}
.so{display:flex;align-items:center;gap:8px}.so a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--mut);font-size:12px;max-width:100%}
.so img{width:64px;height:36px;object-fit:cover;border-radius:4px;flex:none}.so .yt{width:24px;height:17px;border-radius:4px;background:#f00;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:9px;flex:none}
.so .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}.so .no{color:#555b63}
tr .rm{visibility:hidden;color:#8b95a1;font-size:16px;display:inline-flex;margin-left:6px}tr:hover .rm{visibility:visible}.rm:hover{color:#ff9d9d}
.empty{color:var(--mut);padding:40px 8px}
/* 所有单词 */
.lv{display:flex;align-items:center;gap:14px;margin-bottom:12px}.lv b{font-weight:600}.lv span{color:var(--mut);font-size:12.5px}.lv button{margin-left:auto;border:1px solid var(--pur2);color:var(--pur2);border-radius:6px;padding:5px 12px;font-weight:600}
.leg{color:var(--mut);font-size:12px;margin:-4px 0 12px}
.sec{background:#22242a;padding:5px 10px;font-size:12.5px;font-weight:700;border-bottom:1px solid var(--line);margin-top:10px;position:sticky;top:44px}.sec span{color:var(--mut);font-weight:400;margin-left:10px}
.lr{display:flex;gap:16px;padding:7px 4px}.lr i{font-style:normal;flex:0 0 18px;height:18px;border-radius:50%;background:#2b2e34;color:#c9ced4;font-size:10.5px;font-weight:700;text-align:center;line-height:18px;margin-top:3px}
.lr div{flex:1;font-size:15.5px;line-height:1.9;word-spacing:16px;color:#aeb5bd}.lr .vs-w{cursor:context-menu}.lr .a-k{color:#d9dde2}.lr .m-k{color:#9CFFCD}.lr .a-s{color:#FFB86B}.lr .a-r{color:#B894C5}.lr .m-i{color:#B894C5;text-decoration:line-through}
.jump{position:fixed;right:4px;top:170px;display:flex;flex-direction:column;gap:1px;font-size:11.5px;color:var(--mut);text-align:right}.jump a{color:inherit;text-decoration:none;cursor:pointer;padding:0 4px}.jump a:hover{color:#fff}
</style>
<div class="tabs"><b data-t="words" class="on"></b><b data-t="sents"></b><b data-t="all"></b><span class="sp"></span><button class="rv" id="rv">复习</button></div>
<div class="wrap" id="wrap"></div>
<script src="freq.js"></script><script src="vlevel.js"></script><script src="saved.js"></script>
