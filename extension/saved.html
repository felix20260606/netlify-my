<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已收集的词</title>
<style>:root{--bg:#EFF2F1;--ink:#1E2733;--muted:#7C8794;--line:#E6EAEC;--jade:#0C9370}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"PingFang SC",sans-serif}.wrap{max-width:720px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;background:#F0F3F4;color:var(--ink);font-size:14px}button.pri{background:#0FA37A;color:#fff}
#list{display:flex;flex-wrap:wrap;gap:8px}.chip{display:inline-flex;align-items:center;gap:6px;background:#F0F3F4;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.chip b{font-weight:600}.chip i{font-style:normal;cursor:pointer;color:var(--muted);width:20px;height:20px;border-radius:50%;text-align:center;line-height:20px}.chip i:hover{background:#ddd}
#msg{color:var(--jade);font-weight:700;margin-left:6px;align-self:center}</style>
<div class="wrap"><h1>📒 已收集的词</h1><p class="sub">这是插件在本浏览器里保存的备份；同时也已同步到生词本网站的“待整理队列”。</p>
<div class="card"><div class="tools"><button class="pri" id="copy">📋 复制全部（发给 Claude）</button><button id="clear">清空本地备份</button><span id="msg"></span></div><div id="list"></div></div></div>
<script src="saved.js"></script></html>
