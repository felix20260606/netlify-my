# 每 6 小时把线上生词本存进仓库 data/vocab.json（有变化才提交）。
# 生词本不设口令，被乱改时从这里的历史版本还原；data/ 不在 web/ 里，不会触发网站重新部署。
name: 备份生词本
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: backup-vocab
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载生词本
        run: |
          mkdir -p data
          curl -fsS --retry 3 https://ruilearning-my.pages.dev/api/vocab -o /tmp/vocab.json
          jq -e '.ok == true and (.custom | type == "array")' /tmp/vocab.json > /dev/null
          jq 'del(.ok)' /tmp/vocab.json > data/vocab.json
      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vocab.json
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git commit -m "备份生词本 $(TZ=Asia/Shanghai date '+%F %H:%M')"
          git push
