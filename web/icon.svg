  <g stroke="#c9a6e6" stroke-width="9" stroke-linecap="round">
    <path d="M150 238c30-2 58 2 82 12M150 278c30-2 58 2 82 12M150 318c30-2 58 2 82 12"/>
    <path d="M362 238c-30-2-58 2-82 12M362 278c-30-2-58 2-82 12M362 318c-30-2-58 2-82 12"/>
  </g>
  <!-- 字母 A -->
  <path d="M256 82l-44 104h22l9-24h26l9 24h22zM249 144l7-20 7 20z" fill="#ffffff"/>
</svg>
