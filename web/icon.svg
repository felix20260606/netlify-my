<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 英语练习图标：紫色圆角方块 + 白色打开的书 + 书上方的字母 A -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ab52d4"/>
      <stop offset="1" stop-color="#5b2a7c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 书：左右两页 -->
  <path d="M256 214c-38-26-86-34-136-28v178c50-6 98 2 136 28z" fill="#ffffff"/>
  <path d="M256 214c38-26 86-34 136-28v178c-50-6-98 2-136 28z" fill="#efe3fa"/>
  <path d="M256 214v178" stroke="#7a3aa6" stroke-width="6"/>
